workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 120
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.voicetimer.timer
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build ipa for release
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
